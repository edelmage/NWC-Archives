                title: U.S. Naval War College Archives
                welcome_head: U.S. Naval War College Archives
                welcome_message: <p>The NWC Archives is the U.S. Naval War College’s institutional archives and serves as the repository for manuscripts, oral histories, special collections, and rare books documenting the history of the College, naval warfare, and naval activity in Narragansett Bay. Relevant collections may be found by searching finding aids using keywords, names, or subjects. Digital versions of documents or images may be available for download, but in most cases researchers must make an appointment to view these non-circulating collections in the NWC Archives Reading Room, located in Hewitt Hall.</p><p>Only a portion of the NWC archival collections is housed on site, with additional materials remaining in off-site storage. All materials are subject to required security reviews prior to access, which may affect retrieval timelines and require additional lead time for research appointments. Researchers are encouraged to plan accordingly and contact the Archives in advance.</p><p>For more information on how to use this site, please visit our <a href="https://usnwc.libguides.com/archives/faq" target="_blank">FAQ</a>.</p>
                welcome_contact_heading: Contact
                welcome_contact_message: <p>For more information about the NWC Archives, please visit our <a href="https://usnwc.libguides.com/archives/faq" target="_blank">FAQ</a> or email us at <a href="mailto:archives@usnwc.edu">archives@usnwc.edu</a>.</p>